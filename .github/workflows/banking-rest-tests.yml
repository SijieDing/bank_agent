name: Banking REST integration
on:
  push:
    branches: [transfer_money]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Offline model and real loopback REST tests
        run: python -m unittest test_bank_api test_transfer_workflow test_gateway test_authentication test_fast_path -v
